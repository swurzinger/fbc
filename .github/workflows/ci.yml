name: CI

on:
  push:
    branches: [ master, 'test/**', 'ci/**' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  BOOTSTRAP_VERSION: "1.10.1"

jobs:
  # ===========================================================================
  # Linux x86_64 build (disabled during Windows troubleshooting)
  # ===========================================================================
  # linux-x86_64:
  #   ... (temporarily disabled)

  # ===========================================================================
  # Windows builds (x86 and x64) using MSYS2 + MinGW-w64
  # ===========================================================================
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows x86 (32-bit)"
            msystem: MINGW32
            pkg_prefix: mingw-w64-i686
            fbtarget: win32
          - name: "Windows x64 (64-bit)"
            msystem: MINGW64
            pkg_prefix: mingw-w64-x86_64
            fbtarget: win64

    name: ${{ matrix.name }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: >-
            make
            tar
            xz
            ${{ matrix.pkg_prefix }}-gcc
            ${{ matrix.pkg_prefix }}-binutils
            ${{ matrix.pkg_prefix }}-libffi

      - name: Show toolchain info
        run: |
          echo "gcc: $(gcc --version | head -1)"
          echo "as:  $(as --version | head -1)"
          echo "target: $(gcc -dumpmachine)"

      - name: Download and build bootstrap compiler
        run: |
          # Skip if cached from a previous manual run (check for the binary)
          if [ -f "bootstrap/bin/fbc.exe" ]; then
            echo "Bootstrap already present, skipping build"
            exit 0
          fi
          BOOTSTRAP_PACKAGE="FreeBASIC-${BOOTSTRAP_VERSION}-source-bootstrap"
          curl -sL "https://github.com/freebasic/fbc/releases/download/${BOOTSTRAP_VERSION}/${BOOTSTRAP_PACKAGE}.tar.xz" -o "${BOOTSTRAP_PACKAGE}.tar.xz"
          tar xf "${BOOTSTRAP_PACKAGE}.tar.xz"
          cd "${BOOTSTRAP_PACKAGE}"
          if [ "${{ matrix.fbtarget }}" = "win64" ]; then
            echo "TARGET_ARCH := x86_64" > config.mk
          fi
          make -j$(nproc) bootstrap
          cd ..
          mv "${BOOTSTRAP_PACKAGE}" bootstrap

      - name: Populate standalone toolchain dirs
        run: |
          FBTARGET="${{ matrix.fbtarget }}"
          GCC_TARGET="$(gcc -dumpmachine)"
          GCC_VERSION="$(gcc -dumpversion)"
          GCC_LIBDIR="$(gcc -print-file-name=libgcc.a | sed 's|/libgcc\.a$||')"
          MINGW_BIN="$(dirname $(which gcc))"
          MINGW_PREFIX="$MINGW_BIN/.."

          echo "FBTARGET=$FBTARGET GCC_TARGET=$GCC_TARGET GCC_VERSION=$GCC_VERSION"
          echo "GCC_LIBDIR=$GCC_LIBDIR"
          echo "MINGW_PREFIX=$MINGW_PREFIX"

          # bin/<fbtarget>/ - assembler, linker, archiver
          mkdir -p bin/$FBTARGET
          for tool in ar as dlltool gprof ld gcc; do
            cp "$MINGW_BIN/$tool.exe" bin/$FBTARGET/
          done

          # cc1.exe - gcc looks for it relative to its own location at
          # ../lib/gcc/<target>/<version>/cc1.exe
          # So from bin/<fbtarget>/gcc.exe -> bin/lib/gcc/<target>/<version>/cc1.exe
          CC1_DIR="bin/lib/gcc/$GCC_TARGET/$GCC_VERSION"
          mkdir -p "$CC1_DIR"
          # Find cc1.exe in the real gcc installation
          REAL_CC1="$MINGW_PREFIX/lib/gcc/$GCC_TARGET/$GCC_VERSION/cc1.exe"
          if [ ! -f "$REAL_CC1" ]; then
            REAL_CC1="$MINGW_PREFIX/libexec/gcc/$GCC_TARGET/$GCC_VERSION/cc1.exe"
          fi
          if [ -f "$REAL_CC1" ]; then
            cp "$REAL_CC1" "$CC1_DIR/"
            echo "cc1.exe: copied from $REAL_CC1 to $CC1_DIR/"
          else
            echo "ERROR: cc1.exe not found!"
            echo "Searching..."
            find "$MINGW_PREFIX" -name "cc1.exe" 2>/dev/null
            exit 1
          fi

          # lib/<fbtarget>/ - all CRT, gcc, and system libraries
          mkdir -p lib/$FBTARGET

          # Copy files using gcc -print-file-name (guaranteed correct paths)
          copy_file() {
            path="$(gcc -print-file-name=$1)"
            if [ "$path" != "$1" ] && [ -f "$path" ]; then
              cp "$path" "lib/$FBTARGET/$2"
              return 0
            fi
            return 1
          }

          # CRT startup objects
          for f in crt2.o dllcrt2.o gcrt2.o crtbegin.o crtend.o; do
            copy_file "$f" "$f" || echo "skip: $f"
          done

          # GCC internal libs
          for f in libgcc.a libgcc_eh.a libsupc++.a; do
            copy_file "$f" "$f" || echo "skip: $f"
          done

          # MinGW runtime libs
          for f in libmingw32.a libmingwex.a libmoldname.a; do
            copy_file "$f" "$f" || echo "skip: $f"
          done

          # Windows system import libraries (fbc expects .dll.a suffix)
          for lib in advapi32 gdi32 kernel32 msvcrt user32 winmm winspool; do
            copy_file "lib${lib}.a" "lib${lib}.dll.a" || echo "skip: lib${lib}.a"
          done

          # libffi
          copy_file "libffi.a" "libffi.a" || echo "skip: libffi.a"

          echo "=== bin/$FBTARGET ==="
          ls bin/$FBTARGET/
          echo "=== bin/lib/gcc/$GCC_TARGET/$GCC_VERSION ==="
          ls "$CC1_DIR/"
          echo "=== lib/$FBTARGET ==="
          ls lib/$FBTARGET/

      - name: Build fbc (pass 1 - using bootstrap)
        run: |
          rm -f config.mk
          echo "ENABLE_STANDALONE := 1" > config.mk
          if [ "${{ matrix.fbtarget }}" = "win64" ]; then
            echo "TARGET_ARCH := x86_64" >> config.mk
          fi
          make -j$(nproc) FBC="bootstrap/bin/fbc -i bootstrap/inc" </dev/null

      - name: Rebuild fbc (pass 2 - self-host)
        run: |
          mv fbc.exe fbc_pass1.exe
          make -j$(nproc) clean-compiler
          make -j$(nproc) compiler FBC='./fbc_pass1 -i inc' </dev/null
          rm -f fbc_pass1.exe

      - name: Verify fbc works
        run: |
          ./fbc --version
          echo 'print "Hello from fbc"' > hello.bas
          ./fbc hello.bas
          ./hello.exe

      - name: Package minimal standalone compiler
        run: |
          FBTARGET="${{ matrix.fbtarget }}"
          PKGDIR="fbc-$FBTARGET"
          mkdir -p "$PKGDIR"

          # fbc.exe
          cp fbc.exe "$PKGDIR/"

          # bin/<fbtarget>/* and bin/libexec/** (if exists)
          cp -r bin/ "$PKGDIR/bin/"

          # lib/<fbtarget>/*.a, *.o, *.x
          mkdir -p "$PKGDIR/lib/$FBTARGET"
          cp lib/$FBTARGET/*.a "$PKGDIR/lib/$FBTARGET/" 2>/dev/null || true
          cp lib/$FBTARGET/*.o "$PKGDIR/lib/$FBTARGET/" 2>/dev/null || true
          cp lib/$FBTARGET/*.x "$PKGDIR/lib/$FBTARGET/" 2>/dev/null || true

          # Minimal includes
          mkdir -p "$PKGDIR/inc/fbc-int"
          for f in datetime.bi dir.bi file.bi string.bi utf_conv.bi vbcompat.bi; do
            cp "inc/$f" "$PKGDIR/inc/" 2>/dev/null || true
          done
          cp inc/fb*.bi "$PKGDIR/inc/" 2>/dev/null || true
          cp inc/fbc-int/* "$PKGDIR/inc/fbc-int/" 2>/dev/null || true

          # Docs
          cp changelog.txt "$PKGDIR/" 2>/dev/null || true
          cp readme.txt "$PKGDIR/" 2>/dev/null || true

          echo "=== Package: $(find $PKGDIR -type f | wc -l) files ==="

      - name: Upload minimal compiler package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fbc-${{ matrix.fbtarget }}-minimal
          path: fbc-${{ matrix.fbtarget }}/
