name: CI

on:
  push:
    branches: [ master, 'test/**', 'ci/**' ]
  pull_request:
    branches: [ master ]
  # Allow manual trigger from Actions tab (works on any branch)
  workflow_dispatch:

env:
  # Bootstrap fbc version used to compile the compiler
  BOOTSTRAP_VERSION: "1.10.1"

jobs:
  # ===========================================================================
  # Linux x86_64 build (disabled during Windows troubleshooting)
  # ===========================================================================
  # linux-x86_64:
  #   ... (temporarily disabled)

  # ===========================================================================
  # Windows builds (x86 and x64) using MSYS2 + MinGW-w64
  # ===========================================================================
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows x86 (32-bit)"
            msystem: MINGW32
            arch: i686
            pkg_prefix: mingw-w64-i686
            fbtarget: win32
          - name: "Windows x64 (64-bit)"
            msystem: MINGW64
            arch: x86_64
            pkg_prefix: mingw-w64-x86_64
            fbtarget: win64

    name: ${{ matrix.name }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: >-
            make
            tar
            xz
            ${{ matrix.pkg_prefix }}-gcc
            ${{ matrix.pkg_prefix }}-binutils
            ${{ matrix.pkg_prefix }}-libffi

      - name: Show toolchain info
        run: |
          echo "=== gcc ==="
          gcc --version | head -1
          echo "=== gcc search paths ==="
          echo | gcc -E -Wp,-v - 2>&1 | grep "^ " || true
          echo "=== ffi.h check ==="
          gcc -E -include ffi.h -x c /dev/null > /dev/null 2>&1 && echo "ffi.h: found by gcc" || echo "ffi.h: NOT found by gcc"
          echo "=== pkg-config libffi ==="
          pkg-config --cflags --libs libffi 2>&1 || true
          echo "=== pacman libffi files ==="
          pacman -Ql $(pacman -Qq | grep libffi) 2>/dev/null || true

      - name: Cache bootstrap compiler
        id: cache-bootstrap
        uses: actions/cache@v4
        with:
          path: bootstrap
          key: bootstrap-${{ matrix.fbtarget }}-${{ env.BOOTSTRAP_VERSION }}-v2

      - name: Download and build bootstrap compiler
        if: steps.cache-bootstrap.outputs.cache-hit != 'true'
        run: |
          BOOTSTRAP_PACKAGE="FreeBASIC-${BOOTSTRAP_VERSION}-source-bootstrap"
          curl -sL "https://github.com/freebasic/fbc/releases/download/${BOOTSTRAP_VERSION}/${BOOTSTRAP_PACKAGE}.tar.xz" -o "${BOOTSTRAP_PACKAGE}.tar.xz"
          tar xf "${BOOTSTRAP_PACKAGE}.tar.xz"
          cd "${BOOTSTRAP_PACKAGE}"
          if [ "${{ matrix.fbtarget }}" = "win64" ]; then
            echo "TARGET_ARCH := x86_64" >> config.mk
          fi
          make -j$(nproc) bootstrap
          cd ..
          mv "${BOOTSTRAP_PACKAGE}" bootstrap

      - name: Build fbc (pass 1 - using bootstrap)
        run: |
          rm -f config.mk
          echo "ENABLE_STANDALONE := 1" > config.mk
          if [ "${{ matrix.fbtarget }}" = "win64" ]; then
            echo "TARGET_ARCH := x86_64" >> config.mk
          fi
          make -j$(nproc) FBC="bootstrap/bin/fbc -i bootstrap/inc" </dev/null

      - name: Populate standalone toolchain dirs
        run: |
          FBTARGET="${{ matrix.fbtarget }}"
          MINGW_PREFIX="$(dirname $(which gcc))/.."

          # Determine the gcc target triplet
          GCC_TARGET="$(gcc -dumpmachine)"
          GCC_VERSION="$(gcc -dumpversion)"

          echo "FBTARGET=$FBTARGET, MINGW_PREFIX=$MINGW_PREFIX"
          echo "GCC_TARGET=$GCC_TARGET, GCC_VERSION=$GCC_VERSION"

          # bin/<fbtarget>/ - assembler, linker, archiver etc.
          mkdir -p bin/$FBTARGET
          for tool in ar as dlltool gprof ld gcc; do
            cp "$MINGW_PREFIX/bin/$tool.exe" bin/$FBTARGET/
          done

          # cc1.exe for gcc -gen gcc backend
          GCC_LIBEXEC="$MINGW_PREFIX/libexec/gcc/$GCC_TARGET/$GCC_VERSION"
          if [ ! -d "$GCC_LIBEXEC" ]; then
            GCC_LIBEXEC=$(find "$MINGW_PREFIX/libexec/gcc/$GCC_TARGET" -maxdepth 1 -type d 2>/dev/null | tail -1)
          fi
          if [ -f "$GCC_LIBEXEC/cc1.exe" ]; then
            mkdir -p bin/libexec/gcc/$GCC_TARGET/$GCC_VERSION
            cp "$GCC_LIBEXEC/cc1.exe" bin/libexec/gcc/$GCC_TARGET/$GCC_VERSION/
          fi

          # lib/<fbtarget>/ - CRT objects and libraries from MinGW
          mkdir -p lib/$FBTARGET

          # CRT startup objects
          cp "$MINGW_PREFIX/$GCC_TARGET/lib/crt2.o" lib/$FBTARGET/
          cp "$MINGW_PREFIX/$GCC_TARGET/lib/dllcrt2.o" lib/$FBTARGET/
          cp "$MINGW_PREFIX/$GCC_TARGET/lib/gcrt2.o" lib/$FBTARGET/ 2>/dev/null || true
          cp "$MINGW_PREFIX/$GCC_TARGET/lib/crtbegin.o" lib/$FBTARGET/ 2>/dev/null || true
          cp "$MINGW_PREFIX/$GCC_TARGET/lib/crtend.o" lib/$FBTARGET/ 2>/dev/null || true

          # GCC internal libs
          GCC_LIBDIR="$MINGW_PREFIX/lib/gcc/$GCC_TARGET/$GCC_VERSION"
          if [ ! -d "$GCC_LIBDIR" ]; then
            GCC_LIBDIR=$(find "$MINGW_PREFIX/lib/gcc/$GCC_TARGET" -maxdepth 1 -type d | tail -1)
          fi
          cp "$GCC_LIBDIR/crtbegin.o" lib/$FBTARGET/ 2>/dev/null || true
          cp "$GCC_LIBDIR/crtend.o" lib/$FBTARGET/ 2>/dev/null || true
          cp "$GCC_LIBDIR/libgcc.a" lib/$FBTARGET/ 2>/dev/null || true
          cp "$GCC_LIBDIR/libgcc_eh.a" lib/$FBTARGET/ 2>/dev/null || true

          # MinGW runtime and system libs
          cp "$MINGW_PREFIX/$GCC_TARGET/lib/libmingw32.a" lib/$FBTARGET/
          cp "$MINGW_PREFIX/$GCC_TARGET/lib/libmingwex.a" lib/$FBTARGET/
          cp "$MINGW_PREFIX/$GCC_TARGET/lib/libmoldname.a" lib/$FBTARGET/
          cp "$MINGW_PREFIX/$GCC_TARGET/lib/libsupc++.a" lib/$FBTARGET/ 2>/dev/null || \
            cp "$GCC_LIBDIR/libsupc++.a" lib/$FBTARGET/ 2>/dev/null || true

          # Windows system import libraries (as .dll.a)
          for lib in advapi32 gdi32 kernel32 msvcrt user32 winmm winspool; do
            src="$MINGW_PREFIX/$GCC_TARGET/lib/lib${lib}.a"
            if [ -f "$src" ]; then
              cp "$src" lib/$FBTARGET/lib${lib}.dll.a
            fi
          done

          # libffi
          cp "$MINGW_PREFIX/$GCC_TARGET/lib/libffi.a" lib/$FBTARGET/ 2>/dev/null || \
            cp "$MINGW_PREFIX/lib/libffi.a" lib/$FBTARGET/ 2>/dev/null || true

          echo "=== bin/$FBTARGET contents ==="
          ls -la bin/$FBTARGET/
          echo "=== lib/$FBTARGET contents (first 30) ==="
          ls lib/$FBTARGET/ | head -30

      - name: Rebuild fbc (pass 2 - self-host)
        run: |
          mv fbc.exe fbc_pass1.exe
          make -j$(nproc) clean-compiler
          make -j$(nproc) compiler FBC='./fbc_pass1 -i inc' </dev/null
          rm -f fbc_pass1.exe

      - name: Verify fbc works
        run: |
          ./fbc --version
          # Quick smoke test - compile a hello world
          echo 'print "Hello from fbc"' > hello.bas
          ./fbc hello.bas
          ./hello.exe

      - name: Package minimal standalone compiler
        run: |
          FBTARGET="${{ matrix.fbtarget }}"
          PKGDIR="fbc-$FBTARGET"
          mkdir -p "$PKGDIR"

          # fbc.exe
          cp fbc.exe "$PKGDIR/"

          # bin/<fbtarget>/* and bin/libexec/**
          cp -r bin/ "$PKGDIR/bin/"

          # lib/<fbtarget>/*.a, *.o, *.x
          mkdir -p "$PKGDIR/lib/$FBTARGET"
          cp lib/$FBTARGET/*.a "$PKGDIR/lib/$FBTARGET/" 2>/dev/null || true
          cp lib/$FBTARGET/*.o "$PKGDIR/lib/$FBTARGET/" 2>/dev/null || true
          cp lib/$FBTARGET/*.x "$PKGDIR/lib/$FBTARGET/" 2>/dev/null || true

          # Minimal includes (enough to compile most programs)
          mkdir -p "$PKGDIR/inc/fbc-int"
          for f in datetime.bi dir.bi file.bi string.bi utf_conv.bi vbcompat.bi; do
            cp "inc/$f" "$PKGDIR/inc/" 2>/dev/null || true
          done
          cp inc/fb*.bi "$PKGDIR/inc/" 2>/dev/null || true
          cp inc/fbc-int/* "$PKGDIR/inc/fbc-int/" 2>/dev/null || true

          # Docs
          cp changelog.txt "$PKGDIR/" 2>/dev/null || true
          cp readme.txt "$PKGDIR/" 2>/dev/null || true

          echo "=== Package contents ==="
          find "$PKGDIR" -type f | sort | head -50
          echo "..."
          find "$PKGDIR" -type f | wc -l
          echo "total files"

      - name: Upload minimal compiler package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fbc-${{ matrix.fbtarget }}-minimal
          path: fbc-${{ matrix.fbtarget }}/
