name: CI

on:
  push:
    branches: [ master, 'test/**', 'ci/**' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  # Fast debug job - only toolchain setup, no fbc build
  debug-toolchain:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Debug Win32"
            msystem: MINGW32
            pkg_prefix: mingw-w64-i686
            fbtarget: win32
          - name: "Debug Win64"
            msystem: MINGW64
            pkg_prefix: mingw-w64-x86_64
            fbtarget: win64

    name: ${{ matrix.name }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: >-
            ${{ matrix.pkg_prefix }}-gcc
            ${{ matrix.pkg_prefix }}-binutils
            ${{ matrix.pkg_prefix }}-libffi

      - name: Explore toolchain layout
        run: |
          set -x
          FBTARGET="${{ matrix.fbtarget }}"

          GCC_TARGET="$(gcc -dumpmachine)"
          GCC_VERSION="$(gcc -dumpversion)"
          MINGW_PREFIX="$(dirname $(which gcc))/.."

          echo "=== Basic info ==="
          echo "FBTARGET=$FBTARGET"
          echo "GCC_TARGET=$GCC_TARGET"
          echo "GCC_VERSION=$GCC_VERSION"
          echo "MINGW_PREFIX=$MINGW_PREFIX"

          echo "=== gcc -print-file-name for key files ==="
          for f in crt2.o dllcrt2.o gcrt2.o crtbegin.o crtend.o \
                   libgcc.a libgcc_eh.a libsupc++.a \
                   libmingw32.a libmingwex.a libmoldname.a \
                   libkernel32.a libmsvcrt.a libuser32.a libadvapi32.a \
                   libgdi32.a libwinmm.a libwinspool.a \
                   libffi.a; do
            echo "  $f => $(gcc -print-file-name=$f)"
          done

          echo "=== gcc -print-search-dirs ==="
          gcc -print-search-dirs

          echo "=== libexec cc1 ==="
          find "$MINGW_PREFIX/libexec" -name "cc1.exe" 2>/dev/null || echo "cc1.exe not found in libexec"

          echo "=== /mingw*/lib/ top-level ==="
          ls /${{ matrix.msystem == 'MINGW32' && 'mingw32' || 'mingw64' }}/lib/*.a 2>/dev/null | head -20 || echo "(none)"
