name: Debug armv7

on:
  push:
    branches: [ 'test/ci-armv7-debug' ]
  workflow_dispatch:

env:
  BOOTSTRAP_VERSION: "1.10.1"

jobs:
  # Reproduce original setup: matrix with armv6 + armv7 running together
  linux-arm-matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux armv7 (Raspberry Pi)"
            arch: armv7
            distro: bookworm
          - name: "Linux armv6 (Raspberry Pi Zero)"
            arch: armv6
            distro: bookworm

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      - name: Download bootstrap on host
        run: |
          wget -q "https://github.com/freebasic/fbc/releases/download/${{ env.BOOTSTRAP_VERSION }}/FreeBASIC-${{ env.BOOTSTRAP_VERSION }}-source-bootstrap.tar.xz"

      - name: Build and test on ${{ matrix.arch }}
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.arch }}
          distro: ${{ matrix.distro }}
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${PWD}/FreeBASIC-${{ env.BOOTSTRAP_VERSION }}-source-bootstrap.tar.xz:/bootstrap.tar.xz"
          install: |
            apt-get update -q -y
            apt-get install -q -y --no-install-recommends \
              gcc g++ make xz-utils \
              libncurses-dev libffi-dev libgl1-mesa-dev libglu1-mesa-dev \
              libgpm-dev libx11-dev libxext-dev libxpm-dev \
              libxrender-dev libxrandr-dev
          run: |
            set -e
            BOOTSTRAP_PACKAGE="FreeBASIC-${{ env.BOOTSTRAP_VERSION }}-source-bootstrap"
            tar xf /bootstrap.tar.xz
            cd "${BOOTSTRAP_PACKAGE}"
            make -j$(nproc) bootstrap
            cd ..

            # Build fbc (pass 1 - using bootstrap)
            rm -f config.mk
            make -j$(nproc) FBC="${BOOTSTRAP_PACKAGE}/bin/fbc -i ${BOOTSTRAP_PACKAGE}/inc" </dev/null

            # Rebuild fbc (pass 2 - self-host)
            mv bin/fbc bin/fbc_pass1
            make -j$(nproc) clean-compiler
            make -j$(nproc) compiler FBC='bin/fbc_pass1 -i inc' </dev/null
            rm bin/fbc_pass1

            # Verify
            bin/fbc --version

            # Run unit tests
            cd tests
            make unit-tests FBC="$PWD/../bin/fbc -i $PWD/../inc" </dev/null
