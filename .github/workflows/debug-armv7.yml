name: Debug armv7

on:
  push:
    branches: [ 'test/ci-armv7-debug' ]
  workflow_dispatch:

env:
  BOOTSTRAP_VERSION: "1.10.1"

jobs:
  # Test: can we wget anything at all?
  armv7-network-test:
    runs-on: ubuntu-24.04
    name: "armv7 - network test"
    steps:
      - uses: actions/checkout@v7
      - uses: uraimo/run-on-arch-action@v3
        with:
          arch: armv7
          distro: bookworm
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y --no-install-recommends wget ca-certificates
          run: |
            set -e
            echo "Testing DNS..."
            cat /etc/resolv.conf
            echo "Testing small download..."
            wget -q -O /dev/null "https://github.com/robots.txt"
            echo "Small download OK"
            echo "Testing large download..."
            wget -q -O /dev/null "https://github.com/freebasic/fbc/releases/download/${{ env.BOOTSTRAP_VERSION }}/FreeBASIC-${{ env.BOOTSTRAP_VERSION }}-source-bootstrap.tar.xz"
            echo "Large download OK"

  # Test: is it the install size/time that causes issues?
  armv7-heavy-install:
    runs-on: ubuntu-24.04
    name: "armv7 - heavy install + wget"
    steps:
      - uses: actions/checkout@v7
      - uses: uraimo/run-on-arch-action@v3
        with:
          arch: armv7
          distro: bookworm
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y --no-install-recommends \
              gcc g++ make wget xz-utils ca-certificates \
              libncurses-dev libffi-dev libgl1-mesa-dev libglu1-mesa-dev \
              libgpm-dev libx11-dev libxext-dev libxpm-dev \
              libxrender-dev libxrandr-dev
          run: |
            set -e
            echo "Testing wget after heavy install..."
            wget -q -O /dev/null "https://github.com/robots.txt"
            echo "Small download OK"
            wget -q "https://github.com/freebasic/fbc/releases/download/${{ env.BOOTSTRAP_VERSION }}/FreeBASIC-${{ env.BOOTSTRAP_VERSION }}-source-bootstrap.tar.xz"
            ls -la FreeBASIC-*.tar.xz
            echo "Bootstrap download OK"

  # Test: skip githubToken (no image caching) in case cached image is broken
  armv7-no-cache:
    runs-on: ubuntu-24.04
    name: "armv7 - no image cache"
    steps:
      - uses: actions/checkout@v7
      - uses: uraimo/run-on-arch-action@v3
        with:
          arch: armv7
          distro: bookworm
          install: |
            apt-get update -q -y
            apt-get install -q -y --no-install-recommends \
              gcc g++ make wget xz-utils ca-certificates \
              libncurses-dev libffi-dev libgl1-mesa-dev libglu1-mesa-dev \
              libgpm-dev libx11-dev libxext-dev libxpm-dev \
              libxrender-dev libxrandr-dev
          run: |
            set -e
            BOOTSTRAP_PACKAGE="FreeBASIC-${{ env.BOOTSTRAP_VERSION }}-source-bootstrap"
            wget -q "https://github.com/freebasic/fbc/releases/download/${{ env.BOOTSTRAP_VERSION }}/${BOOTSTRAP_PACKAGE}.tar.xz"
            tar xf "${BOOTSTRAP_PACKAGE}.tar.xz"
            ls "${BOOTSTRAP_PACKAGE}/bootstrap/linux-arm/"
            echo "Success!"

  # Test: download on host, pass via volume mount
  armv7-host-download:
    runs-on: ubuntu-24.04
    name: "armv7 - host download + volume"
    steps:
      - uses: actions/checkout@v7

      - name: Download bootstrap on host
        run: |
          wget -q "https://github.com/freebasic/fbc/releases/download/${{ env.BOOTSTRAP_VERSION }}/FreeBASIC-${{ env.BOOTSTRAP_VERSION }}-source-bootstrap.tar.xz"

      - uses: uraimo/run-on-arch-action@v3
        with:
          arch: armv7
          distro: bookworm
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${PWD}/FreeBASIC-${{ env.BOOTSTRAP_VERSION }}-source-bootstrap.tar.xz:/bootstrap.tar.xz"
          install: |
            apt-get update -q -y
            apt-get install -q -y --no-install-recommends \
              gcc g++ make xz-utils \
              libncurses-dev libffi-dev libgl1-mesa-dev libglu1-mesa-dev \
              libgpm-dev libx11-dev libxext-dev libxpm-dev \
              libxrender-dev libxrandr-dev
          run: |
            set -e
            tar xf /bootstrap.tar.xz
            ls FreeBASIC-*/bootstrap/linux-arm/
            echo "Volume mount + extract OK"
