name: Debug armv7

on:
  push:
    branches: [ 'test/ci-armv7-debug' ]
  workflow_dispatch:

env:
  BOOTSTRAP_VERSION: "1.10.1"

jobs:
  # Step 1: Just install deps (matching the real CI)
  armv7-install-deps:
    runs-on: ubuntu-24.04
    name: "armv7 - install deps only"
    steps:
      - uses: actions/checkout@v7
      - uses: uraimo/run-on-arch-action@v3
        with:
          arch: armv7
          distro: bookworm
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y --no-install-recommends \
              gcc g++ make wget xz-utils \
              libncurses-dev libffi-dev libgl1-mesa-dev libglu1-mesa-dev \
              libgpm-dev libx11-dev libxext-dev libxpm-dev \
              libxrender-dev libxrandr-dev
          run: |
            uname -a
            gcc --version
            echo "Install deps succeeded!"

  # Step 2: Install deps + download bootstrap
  armv7-download-bootstrap:
    runs-on: ubuntu-24.04
    name: "armv7 - download bootstrap"
    steps:
      - uses: actions/checkout@v7
      - uses: uraimo/run-on-arch-action@v3
        with:
          arch: armv7
          distro: bookworm
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y --no-install-recommends \
              gcc g++ make wget xz-utils \
              libncurses-dev libffi-dev libgl1-mesa-dev libglu1-mesa-dev \
              libgpm-dev libx11-dev libxext-dev libxpm-dev \
              libxrender-dev libxrandr-dev
          run: |
            set -e
            BOOTSTRAP_PACKAGE="FreeBASIC-${{ env.BOOTSTRAP_VERSION }}-source-bootstrap"
            wget -q "https://github.com/freebasic/fbc/releases/download/${{ env.BOOTSTRAP_VERSION }}/${BOOTSTRAP_PACKAGE}.tar.xz"
            tar xf "${BOOTSTRAP_PACKAGE}.tar.xz"
            ls -la "${BOOTSTRAP_PACKAGE}/"
            echo "Download + extract succeeded!"

  # Step 3: Full build (same as real CI)
  armv7-full-build:
    runs-on: ubuntu-24.04
    name: "armv7 - full build"
    steps:
      - uses: actions/checkout@v7
      - uses: uraimo/run-on-arch-action@v3
        with:
          arch: armv7
          distro: bookworm
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y --no-install-recommends \
              gcc g++ make wget xz-utils \
              libncurses-dev libffi-dev libgl1-mesa-dev libglu1-mesa-dev \
              libgpm-dev libx11-dev libxext-dev libxpm-dev \
              libxrender-dev libxrandr-dev
          run: |
            set -e
            BOOTSTRAP_VERSION="${{ env.BOOTSTRAP_VERSION }}"
            BOOTSTRAP_PACKAGE="FreeBASIC-${BOOTSTRAP_VERSION}-source-bootstrap"

            # Download and build bootstrap compiler
            wget -q "https://github.com/freebasic/fbc/releases/download/${BOOTSTRAP_VERSION}/${BOOTSTRAP_PACKAGE}.tar.xz"
            tar xf "${BOOTSTRAP_PACKAGE}.tar.xz"
            cd "${BOOTSTRAP_PACKAGE}"
            make -j$(nproc) bootstrap
            cd ..

            # Build fbc (pass 1 - using bootstrap)
            rm -f config.mk
            make -j$(nproc) FBC="${BOOTSTRAP_PACKAGE}/bin/fbc -i ${BOOTSTRAP_PACKAGE}/inc" </dev/null

            # Rebuild fbc (pass 2 - self-host)
            mv bin/fbc bin/fbc_pass1
            make -j$(nproc) clean-compiler
            make -j$(nproc) compiler FBC='bin/fbc_pass1 -i inc' </dev/null
            rm bin/fbc_pass1

            # Verify
            bin/fbc --version

            # Run unit tests
            cd tests
            make unit-tests FBC="$PWD/../bin/fbc -i $PWD/../inc" </dev/null
